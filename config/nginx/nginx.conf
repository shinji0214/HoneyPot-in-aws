# ハニーポット用 nginx.conf（/etc/nginx/nginx.conf を丸ごと置き換える）
# 方針:
#   - 何も脆弱な物は置かない。トップは静的ページ、それ以外は全部 404
#   - アクセスログは JSON 1行形式 → CloudWatch Logs Insights がフィールドを自動認識する
#   - ALB 経由なので X-Forwarded-For から実クライアントIPを復元する

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ALB（VPC内アドレス）だけを信頼し、その手前のクライアントIPを $remote_addr にする。
    # real_ip_recursive on なので、攻撃者が X-Forwarded-For を偽装しても ALB が見た送信元IPが採用される
    set_real_ip_from 10.100.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format honeypot_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"xff":"$http_x_forwarded_for",'
        '"peer_ip":"$realip_remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"path":"$uri",'
        '"args":"$args",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_length":$request_length,'
        '"request_time":$request_time,'
        '"host":"$host",'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer",'
        '"content_type":"$content_type",'
        '"accept":"$http_accept",'
        '"accept_language":"$http_accept_language",'
        '"forwarded_proto":"$http_x_forwarded_proto",'
        '"amzn_trace_id":"$http_x_amzn_trace_id"'
        '}';

    access_log /var/log/nginx/access.log honeypot_json;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ALB ヘルスチェック（ログに出さない）
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            default_type text/html;
            return 200 '<!doctype html><html><head><title>Welcome</title></head><body><h1>It works!</h1></body></html>';
        }

        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow:\n";
        }

        # それ以外（/wp-login.php, /.env など）は全て 404。ログに残すのが目的
        location / {
            return 404;
        }
    }
}
