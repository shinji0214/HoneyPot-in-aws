# スマホから honeypot の EC2 を緊急隔離する（scripts/emergency-isolate.sh を実行）
# 実行: GitHub → Actions → "緊急隔離（Emergency isolate）" → Run workflow → confirm に ISOLATE と入力
# 事前設定: Settings → Secrets and variables → Actions → Secrets に
#           AWS_EMERGENCY_ROLE_ARN = terraform/bootstrap の output emergency_role_arn（docs/07）
name: 緊急隔離（Emergency isolate）

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "誤操作防止: ISOLATE と入力"
        required: true
        type: string
      snapshot:
        description: "調査用の EBS スナップショットを取る"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write # OIDC で AWS ロールを引き受けるため
  contents: read

concurrency:
  group: emergency-isolate
  cancel-in-progress: false

jobs:
  isolate:
    if: inputs.confirm == 'ISOLATE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_EMERGENCY_ROLE_ARN }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true

      - name: Isolate and stop EC2
        env:
          SNAPSHOT: ${{ inputs.snapshot && '1' || '0' }}
        run: |
          chmod +x scripts/emergency-isolate.sh
          ./scripts/emergency-isolate.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## Emergency isolate: ${{ job.status }}"
            echo "次: PC から export-guardduty.sh / export-logs.sh で退避 → Actions「Terraform」で honeypot を destroy（docs/06）"
          } >> "$GITHUB_STEP_SUMMARY"
