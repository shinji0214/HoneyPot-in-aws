# GitHub Actions のバージョン更新 PR を Dependabot に作らせる設定。
# 運用: 一度だけ動かして更新 PR を作らせ、PR ができたらこのファイルを削除して止める
#       （ファイルが main に入った時点で初回チェックが走る）
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # 更新をまとめて1つの PR にする
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
